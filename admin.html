<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Nebula X</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Nebula X</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Menu principal -->
                <ul class="navbar-nav me-auto" id="navbarLinks">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="sneakers1.html">Sneakers</a></li>
                    <li class="nav-item"><a class="nav-link" href="jackets1.html">Jackets</a></li>
                    <li class="nav-item"><a class="nav-link" href="tshirts1.html">T-Shirts</a></li>
                    <li class="nav-item"><a class="nav-link" href="jeans1.html">Jeans</a></li>
                    <li class="nav-item"><a class="nav-link" href="collectibles.html">Collectibles</a></li>
                    <li class="nav-item"><a class="nav-link" href="merchandise1.html">Merchandise</a></li>
                    <li class="nav-item"><a class="nav-link" href="aboutus.html">About Us</a></li>
                </ul>

                <!-- Botões alinhados à direita -->
                <div class="d-flex align-items-center">
                    <button type="button" class="btn btn-outline-dark me-3" data-bs-toggle="modal"
                        data-bs-target="#cartModal">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="badge bg-danger" id="cartCount">0</span>
                    </button>
                    <a href="login.html" class="btn btn-outline-dark me-3" id="loginBtn">
                        <i class="fas fa-user"></i> Login
                    </a>
                    <a href="#" class="btn btn-outline-dark d-none" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Admin Content -->
    <div class="container mt-5">
        <h2 class="text-center">Manage Clients</h2>

        <div id="tv" class="alert alert-info text-center">Loading...</div>


        <!-- Clients Table -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Password</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="tb">
                    <!-- Os dados da tabela serão inseridos dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center p-3 mt-5">
        <p>@ 2024, Nebula X Admin Panel</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="Connection/admin.js"></script>
    <script src="/Connection/navbar.js"></script>

</html>
