<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Checkout - Nebula X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .checkout-container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background-color: #5c67f2;
            border: none;
        }

        .btn-primary:hover {
            background-color: #4955e0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Nebula X</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="sneakers1.html">Sneakers</a></li>
                    <li class="nav-item"><a class="nav-link" href="jackets1.html">Jackets</a></li>
                    <li class="nav-item"><a class="nav-link" href="tshirts1.html">T-Shirts</a></li>
                    <li class="nav-item"><a class="nav-link" href="jeans1.html">Jeans</a></li>
                    <li class="nav-item"><a class="nav-link" href="collectibles.html">Collectibles</a></li>
                    <li class="nav-item"><a class="nav-link" href="merchandise1.html">Merchandise</a></li>
                    <li class="nav-item"><a class="nav-link" href="aboutus.html">About Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Checkout Form -->
    <div class="container mt-5 d-flex justify-content-center">
        <div class="checkout-container">
            <h2 class="text-center mb-4">Checkout</h2>
            <form id="checkoutForm">
                <!-- Personal Information -->
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                </div>
                <div class="mb-3">
                    <label for="nif" class="form-label">NIF (Tax Identification Number)</label>
                    <input type="text" class="form-control" id="nif" placeholder="Enter your NIF" required>
                </div>

                <!-- Address Information -->
                <div class="mb-3">
                    <label for="street" class="form-label">Street Address</label>
                    <input type="text" class="form-control" id="street" placeholder="Enter your street address"
                        required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" placeholder="Enter your city" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="country" class="form-label">Country</label>
                        <input type="text" class="form-control" id="country" placeholder="Enter your country" required>
                    </div>
                </div>

                <!-- Payment Method -->
                <div class="mb-3">
                    <label for="paymentMethod" class="form-label">Payment Method</label>
                    <select class="form-select" id="paymentMethod" required>
                        <option value="" selected disabled>Select a payment method</option>
                        <option value="creditCard">Credit Card</option>
                        <option value="paypal">PayPal</option>
                    </select>
                </div>

                <!-- Credit Card Fields -->
                <div id="creditCardFields" class="hidden">
                    <div class="mb-3">
                        <label for="cardNumber" class="form-label">Card Number</label>
                        <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="expiryDate" class="form-label">Expiry Date</label>
                            <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cvv" class="form-label">CVV</label>
                            <input type="text" class="form-control" id="cvv" placeholder="123">
                        </div>
                    </div>
                </div>

                <!-- PayPal Fields -->
                <div id="paypalFields" class="hidden">
                    <div class="mb-3">
                        <label for="paypalEmail" class="form-label">PayPal Email</label>
                        <input type="email" class="form-control" id="paypalEmail" placeholder="your-email@example.com">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Proceed to Payment</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("paymentMethod").addEventListener("change", function () {
            let method = this.value;
            document.getElementById("creditCardFields").classList.add("hidden");
            document.getElementById("paypalFields").classList.add("hidden");

            if (method === "creditCard") {
                document.getElementById("creditCardFields").classList.remove("hidden");
            } else if (method === "paypal") {
                document.getElementById("paypalFields").classList.remove("hidden");
            }
        });

        document.getElementById("checkoutForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let method = document.getElementById("paymentMethod").value;
            if (!method) {
                alert("Please select a payment method.");
                return;
            }

            setTimeout(() => {
                window.location.href = "orderconfirmation.html";
            }, 1500);
        });
    </script>

</body>

</html>
