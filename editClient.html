                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Menu principal -->
                <ul class="navbar-nav me-auto" id="navbarLinks">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="sneakers1.html">Sneakers</a></li>

                <!-- Botões alinhados à direita -->
                <div class="d-flex align-items-center">
                    <button type="button" class="btn btn-outline-dark me-3" data-bs-toggle="modal"
                        data-bs-target="#cartModal">

                        <span class="badge bg-danger" id="cartCount">0</span>

    <!-- Edit Client Form -->
    <div class="container mt-5">
        <h2 class="text-center" id="clientLegend">Edit Client</h2>
        <form id="editForm" class="my-3">
            <input type="hidden" id="id_client" name="id_client">
            <div class="mb-3">
                <label for="full_name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="full_name" name="full_name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone:</label>
                <input type="text" class="form-control" id="phone" name="phone" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address:</label>
                <input type="text" class="form-control" id="address" name="address" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">New Password (leave blank to keep existing):</label>
                <input type="password" class="form-control" id="password" name="password">
            </div>
            <button type="button" id="btUpdate" class="btn btn-primary w-100">Update Client</button>
            <button type="button" id="btcancel" class="btn btn-secondary w-100 mt-2">Cancel</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./Connection/editclient.js"></script>
    <script src="/Connection/navbar.js"></script>
</body>
