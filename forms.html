<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us - Nebula X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>


<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="index.html">Nebula X</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Menu principal -->
                    <ul class="navbar-nav me-auto" id="navbarLinks">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="sneakers1.html">Sneakers</a></li>
                        <li class="nav-item"><a class="nav-link" href="jackets1.html">Jackets</a></li>
                        <li class="nav-item"><a class="nav-link" href="tshirts1.html">T-Shirts</a></li>
                        <li class="nav-item"><a class="nav-link" href="jeans1.html">Jeans</a></li>
                        <li class="nav-item"><a class="nav-link" href="collectibles.html">Collectibles</a></li>
                        <li class="nav-item"><a class="nav-link" href="merchandise1.html">Merchandise</a></li>
                        <li class="nav-item"><a class="nav-link" href="aboutus.html">About Us</a></li>
                    </ul>

                    <!-- Botões alinhados à direita -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-outline-dark me-3" data-bs-toggle="modal"
                            data-bs-target="#cartModal">
                            <i class="fas fa-shopping-cart"></i> Cart
                            <span class="badge bg-danger" id="cartCount">0</span>
                        </button>
                        <a href="login.html" class="btn btn-outline-dark me-3" id="loginBtn">
                            <i class="fas fa-user"></i> Login
                        </a>
                        <a href="#" class="btn btn-outline-dark d-none" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Cart Modal -->
        <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="cartModalLabel">Shopping Cart</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="cartItems">
                        <!-- Cart items will be displayed here -->
                    </div>
                    <div class="modal-footer">
                        <div>Total: $<span id="cartTotal">0.00</span></div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary"
                            onclick="window.location.href='checkout1.html'">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
        </nav>
        <div class="container mt-5">
            <h1>Contact Nebula X</h1>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Your Email</label>
                    <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Your Message</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Type your message here..."
                        required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" onclick="contactUs()">Submit</button>

            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
        <script src="/Connection/cart.js"></script>
        <script src="/Connection/navbar.js"></script>

</body>

</html>
