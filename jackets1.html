<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nebula X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet">
</head>

<header>
    <script src="Connection/getjeans.js"></script>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cartModalLabel">Shopping Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="cartItems">
                    <!-- Cart items will be displayed here -->
                </div>
                <div class="modal-footer">
                    <div>Total: $<span id="cartTotal">0.00</span></div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary"
                        onclick="window.location.href='checkout1.html'">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </div>



</header>
<section>

    <h1 class="Container mt-5 text-center" class="padding" class="jackets">Jackets</h1>
    <p class="Container mt-5 mb-5  text-center">The most unique and exclusive jackets on the market !</p>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col">
            <div class="card">
                <img src="Imagens/jk1.png" class="card-img-top" alt="Moutain Light">
                <div class="card-body">

                    <h1 class="card-title" id="title5"></h1>
                    <p class="card-text" id="price5"></p>
                    <button type="button" class="btn btn-primary" onclick="addJacketsToCart1()">Add to Cart</button>

                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="Imagens/jk2.png" class="card-img-top" alt="Gore-Tex">
                <div class="card-body">

                    <h1 class="card-title" id="title6"></h1>
                    <p class="card-text" id="price6"></p>
                    <button type="button" class="btn btn-primary" onclick="addJacketsToCart2()">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="Imagens/jk3.png" class="card-img-top" alt="Gore-Yellow">
                <div class="card-body">


                    <h1 class="card-title" id="title7"></h1>
                    <p class="card-text" id="price7"></p>
                    <button type="button" class="btn btn-primary" onclick="addJacketsToCart3()">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="Imagens/jk4.png" class="card-img-top" alt="North Face">
                <div class="card-body">

                    <h1 class="card-title" id="title8"></h1>
                    <p class="card-text" id="price8"></p>
                    <button type="button" class="btn btn-primary" onclick="addJacketsToCart4()">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</section>
