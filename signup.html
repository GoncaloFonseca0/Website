<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Nebula X</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="sneakers1.html">Sneakers</a></li>
                    <li class="nav-item"><a class="nav-link" href="jackets1.html">Jackets</a></li>

                <a href="login.html" class="btn btn-outline-dark">
                    <i class="fas fa-user"></i> Login
                </a>
            </div>
        </div>
    </nav>

    <!-- User Registration Form -->
    <div class="container mt-5">
        <h2 class="text-center">Sign-up today!</h2>

        <div id="tv"></div>

        <form id="frm" class="my-3">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Name:</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Email:</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Phone:</label>
                    <input type="number" class="form-control" name="phone" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Address:</label>
                    <input type="text" class="form-control" name="address" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Password:</label>
                    <input type="password" class="form-control" name="password">
                </div>
            </div>
            <button type="button" id="btinsert" class="btn btn-primary w-100">Add Client</button>
            <div id="signup-message"></div>
        </form>

        <!-- Footer -->
        <footer class="bg-light text-center p-3 mt-5">
            <p>&copy; 2024, Nebula X</p>
        </footer>

        <script src="Connection/signup.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
